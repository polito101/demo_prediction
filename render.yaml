# Blueprint Render: https://render.com/docs/infrastructure-as-code
# Tras hacer push: https://dashboard.render.com/blueprint/new?repo=https://github.com/polito101/demo_prediction
services:
  - type: web
    name: predict-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: predict-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: predict-db
    databaseName: predict_app
    plan: free
    region: oregon
